name: Temp Unzip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and stage files
        run: |
          set -euo pipefail
          test -f mailsentry.zip
          rm -rf /tmp/ms-extract
          mkdir -p /tmp/ms-extract
          unzip -o mailsentry.zip -d /tmp/ms-extract
          echo "Files in zip:"
          find /tmp/ms-extract/mailsentry -type f | sort
          test -f /tmp/ms-extract/mailsentry/mailsentry/live/__init__.py
          test -f /tmp/ms-extract/mailsentry/.github/workflows/ci.yml
          cp /tmp/ms-extract/mailsentry/.github/workflows/ci.yml ./ci.yml.staged
          cp -a /tmp/ms-extract/mailsentry/. ./
          rm -f .github/workflows/ci.yml
          rm -f mailsentry.zip
          echo "Tree after extraction:"
          find . -path ./.git -prune -o -type f -print | sort
      - name: Commit extracted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Upload MailSentry product files"
          git push
